<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수행 안내</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 36px 28px;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: 22px;
            color: #222222;
        }
        p {
            margin: 0 0 24px 0;
            font-size: 14px;
            color: #666666;
        }
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .link-item {
            display: block;
            padding: 15px 20px;
            background-color: #24292f;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            transition: background-color 0.2s, transform 0.1s;
        }
        .link-item:hover {
            background-color: #0969da;
        }
        .link-item:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>페이지 목록</h1>
        <p>이동할 페이지를 선택하세요.</p>
        <div class="link-list">
            <a href="sh1.html" class="link-item">1학기 수행평가 안내 (sh1.html)</a>
            <a href="sh2.html" class="link-item">2학기 수행평가 안내 (sh2.html)</a>
        </div>
    </div>
</body>
</html>
